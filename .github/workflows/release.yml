# Builds the Ace app and publishes a GitHub Release.
# Two ways to start it:
#   1. Push a tag like v4.1.1 (git tag v4.1.1 && git push origin v4.1.1). A tag like v4.2.0-beta.1 makes a beta
#      (a pre-release), which only goes to people with "beta updates" on.
#   2. On GitHub: Actions > Release > Run workflow, type the version (like 4.1.1) and press Run.
# The zip has Ace.exe (self-contained, no .NET install needed), NimbusUpdater.exe, Data and Setup-AceV4.ps1.
# Ace's auto-updater downloads NimbusAce-win-x64.zip from the newest release and checks it
# against NimbusAce-win-x64.zip.sha256 before installing it.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 4.1.1 (or 4.2.0-beta.1 for a beta)'
        required: true
        default: '4.1.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Work out the version
        id: ver
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $raw = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME }
          $v = $raw.Trim().TrimStart('v', 'V')
          if ($v -notmatch '^\d+\.\d+(\.\d+)?(-[0-9A-Za-z.-]+)?$') { throw "'$raw' isn't a version like 4.0.1" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT
          "prerelease=$(if ($v.Contains('-')) { 'true' } else { 'false' })" >> $env:GITHUB_OUTPUT
          Write-Host "Releasing v$v"

      - name: Build Ace.exe (self-contained) and zip it
        shell: pwsh
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: ./Build-Release.ps1 -Version $env:VERSION

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Ace ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: |
            NimbusAce-win-x64.zip
            NimbusAce-win-x64.zip.sha256
